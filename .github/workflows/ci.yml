name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # tokens and shared emit .d.ts that apps/app type-checks against,
      # so they have to build before anything else runs.
      - name: Build packages
        run: |
          npm run build -w @bookflow/shared
          npm run build -w @bookflow/tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Skips loudly when FIGMA_TOKEN is unset, so this is green before
      # the secret exists rather than blocking the first CI run.
      - name: Token drift vs Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: npm run tokens:check-figma

      # The web build, added in M4a. Two steps on purpose.
      #
      # `--clear` is not optional. Metro's per-file transform cache does
      # not invalidate on a `babel.config.js` change, so without it a
      # config edit can silently fail to apply and the bundle that ships
      # is not the one the config describes. Measured while building
      # M4a: the same source exported with and without a cleared cache
      # gave different bundles.
      - name: Web bundle
        run: npm run build:web -- --clear

      # A barrel import once added 11 MB to this export without failing
      # anything else here: it typechecked, it linted, it bundled, it
      # booted, and every pixel rendered. The only symptom of that class
      # is the number, so the number gets an assertion. Verified to fail
      # on the pre-M4c bundle and pass on the current one.
      - name: Web payload budget
        run: npm run check:bundle-size

      # Then LOAD it. `expo export` exiting 0 means nothing on its own:
      # it writes a valid bundle and still ships a blank page if
      # `import.meta` is anywhere in the graph, because Expo serves the
      # bundle as a classic <script> and that is a syntax error outside
      # a module. This asserts the Welcome screen paints at 390 and
      # 1440 with a clean console. Verified to fail on a bundle with
      # `import.meta` reintroduced, so it is a guard rather than a
      # formality.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Web loads
        run: npm run test:web

      # The 21 Supabase edge functions had NO type checking of any kind:
      # ESLint excludes them (Deno `npm:` specifiers are unresolvable
      # under Node resolution) and tsc never saw them. That is ~6,000
      # lines including the whole book-processing pipeline.
      #
      # Adding this found 22 errors, among them a PostgREST embedded
      # resource typed as an object when it returns an array — which
      # would have made a chapter name silently vanish from every AI
      # page citation.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Native bundle still builds
        run: cd apps/app && npx expo export --platform android --output-dir /tmp/android-ci --clear
